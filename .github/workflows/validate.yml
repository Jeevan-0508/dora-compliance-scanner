name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Requirement model is well-formed and docs/ matches data/
        run: python scripts/validate_model.py
      - name: App parses
        run: node -e "new Function(require('fs').readFileSync('docs/app.js','utf8'))"
      - name: Engine scoring logic
        run: node tests/engine.test.mjs
